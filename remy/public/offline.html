<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#234334"><title>Remy · Offline draft</title><style>body{font:16px/1.6 system-ui;background:#f6f8f9;color:#203629;max-width:480px;margin:8vh auto;padding:24px}h1{font-size:32px;line-height:1.2}textarea,input,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #dbe4d5;border-radius:8px;margin:8px 0 16px}textarea{height:160px}button{background:#234334;color:white}small{color:#71836a}</style><img src="/favicon.svg" width="48" height="48" alt="Remy"><h1>A meal worth remembering.</h1><p>You’re offline. Save a food draft here, then review it in Remy when you reconnect.</p><form id="draft"><label for="date">Date eaten</label><input id="date" type="date" required><label for="text">Food and portions</label><textarea id="text" required placeholder="Dinner was…"></textarea><button>Save on this device</button></form><p id="status" role="status"></p><small>Drafts stay on this device. They are not synced or included in your totals yet.</small><p><a href="/">Try opening Remy again</a></p><script>document.querySelector('#date').value=new Date().toLocaleDateString('en-CA');document.querySelector('#draft').onsubmit=e=>{e.preventDefault();const text=document.querySelector('#text').value,date=document.querySelector('#date').value;try{const drafts=JSON.parse(localStorage.getItem('remy-offline-drafts')||'[]');drafts.push({id:crypto.randomUUID(),kind:'meal',ownerId:null,localDate:date,queuedAt:new Date().toISOString(),data:{title:text.slice(0,300),mealType:'Dinner',mealTime:null,messageTime:new Date().toISOString(),notes:text,confidence:'unknown',workoutId:null,calories:null,carbs:null,protein:null,fat:null,fiber:null}});localStorage.setItem('remy-offline-drafts',JSON.stringify(drafts));document.querySelector('#status').textContent='Draft saved. Review it in Remy when online.';document.querySelector('#text').value=''}catch{document.querySelector('#status').textContent='Could not save on this device. Keep this page open and copy your draft.'}};</script></html>
