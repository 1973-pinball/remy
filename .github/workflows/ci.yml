name: Validate Remy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remy/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
      - run: npm run build
